[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Autonomous e-commerce support resolution agent built with LangGraph: router -> specialist agents -> policy gate -> human approval -> idempotent execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
stripe = ["stripe>=15"]
dev = ["pytest>=8"]

[project.scripts]
support = "support_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_agent = ["kb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
